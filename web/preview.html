<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bitter";src:url(fonts/Bitter.ttf)}
@font-face{font-family:"Alfa Slab One";src:url(fonts/AlfaSlabOne-Regular.ttf)}
body{margin:0;background:#c9b48a;display:flex;flex-wrap:wrap;gap:8px;padding:10px}
canvas{width:150px;height:210px}.cam{width:110px;height:110px}.pr{width:150px;height:150px}
</style></head><body><script src="art.js"></script><script>
(async()=>{await document.fonts.load('40px "Bitter"');await document.fonts.load('40px "Alfa Slab One"');
const cards=[[11,'H'],[11,'D'],[11,'S'],[11,'C'],[12,'H'],[12,'D'],[12,'S'],[12,'C'],[13,'H'],[13,'D'],[13,'S'],[13,'C'],[14,'S'],[14,'H'],[9,'C'],[10,'D']];
for(const [r,s] of cards) document.body.appendChild(Art.face({r,s}));
document.body.appendChild(Art.back());
for(const w of ['barb','dale','june']){const c=Art.cameo(w,220);c.className='cam';document.body.appendChild(c)}
for(const f of ['mug','popcorn','icon']){const c=Art[f](f==='icon'?512:300);c.className='pr';document.body.appendChild(c)}
document.title='ready';})();
</script></body></html>
